[pytest]
testpaths = .
python_files = test_*.py
addopts = -v --strict-markers --cov=main --cov-branch --cov-fail-under=80 --cov-report=term-missing --cov-report=xml --junitxml=junit-report.xml
markers =
    unit: Pruebas unitarias aisladas sobre endpoints y lógica base
    functional: Pruebas funcionales end-to-end y casos borde HTTP
    contract: Pruebas de contrato de esquema JSON, cabeceras CORS y métricas Prometheus
