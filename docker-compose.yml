services:
  redis-cache:
    image: redis:7-alpine
    container_name: clima-redis
    networks:
      - backend
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api-clima:
    build:
      context: .
      dockerfile: Dockerfile
    image: microservicio-clima:1.0
    container_name: microservicio-clima
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - REDIS_HOST=redis-cache
    networks:
      - frontend
      - backend
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    depends_on:
      redis-cache:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  frontend:
  backend:

volumes:
  redis_data: