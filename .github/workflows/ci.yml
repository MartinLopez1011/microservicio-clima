name: Pipeline CI/CD Microservicio Clima

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # JOB 1: Commit Stage - Pruebas Unitarias y Cobertura 
  test-app:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install pytest pytest-cov

      - name: Ejecutar PyTest con bloqueo por cobertura (< 80% falla)
        run: pytest test_main.py --cov=main --cov-fail-under=80 --cov-report=xml

      - name: Subir reporte de cobertura para SonarCloud
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # JOB 2: Validación Estática de Dockerfile y Workflows 
  validate-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validar Dockerfile con Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

      - name: Validar sintaxis del Workflow con Actionlint
        uses: raven-actions/actionlint@v2

  # JOB 3: Seguridad SCA (Snyk) y SAST (SonarCloud) con Bloqueo 
  security-scan:
    needs: [test-app, validate-static]
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código con historial completo para SonarCloud
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Descargar reporte de cobertura
        uses: actions/download-artifact@v4
        with:
          name: coverage-report

      - name: Snyk SCA — Escanear dependencias Python (Bloquea en High/Critical)
        uses: snyk/actions/python@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test
          args: --file=requirements.txt --severity-threshold=high

      - name: SonarCloud SAST — Análisis de Código y Quality Gate
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=TU_USUARIO_microservicio-clima
            -Dsonar.organization=TU_ORGANIZACION
            -Dsonar.sources=main.py
            -Dsonar.tests=test_main.py
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.qualitygate.wait=true

  # JOB 4: Construcción y Escaneo de Imagen Docker 
  build-image:
    needs: security-scan
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Construir imagen Docker Multi-stage
        run: docker build -t microservicio-clima:1.0 .

      - name: Snyk Container — Escanear imagen Docker (Bloquea en High/Critical)
        uses: snyk/actions/docker@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: microservicio-clima:1.0
          args: --file=Dockerfile --severity-threshold=high

  # JOB 5: Despliegue Automático en Entorno Simulado con Orquestación 
    needs: build-image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Desplegar stack orquestado con Docker Compose
        run: docker compose up -d --build

      - name: Verificar estado de salud y trazabilidad del despliegue
        run: |
          sleep 10
          docker compose ps
          docker compose logs api-clima

      - name: Apagar y limpiar entorno simulado
        if: always()
        run: docker compose down -v