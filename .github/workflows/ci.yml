name: Pipeline CI DevOps

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  integracion_continua:
    name: Integración Continua y Empaquetado
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar entorno Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias del proyecto y testing
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Verificación de sintaxis del código
        run: |
          python -m py_compile main.py test_main.py

      - name: Ejecutar pruebas unitarias automatizadas
        run: |
          pytest test_main.py -v --tb=short

      - name: Empaquetar artefacto desplegable
        run: |
          mkdir -p dist
          # Se empaquetan los archivos necesarios para la ejecución del microservicio
          zip -r dist/microservicio-clima-${{ github.sha }}.zip main.py requirements.txt

      - name: Publicar artefacto de la aplicación (Artifact Build)
        uses: actions/upload-artifact@v4
        with:
          name: microservicio-clima-build
          path: dist/*.zip
          retention-days: 14
