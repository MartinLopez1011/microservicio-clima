name: Pipeline CI/CD DevOps - Microservicio Clima

# ==============================================================================
# PIPELINE CI/CD EN GITHUB ACTIONS
# ==============================================================================

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read
  security-events: write

jobs:
  # ----------------------------------------------------------------------------
  # JOB 1: PRUEBAS UNITARIAS 
  # ----------------------------------------------------------------------------
  pruebas_unitarias:
    name: IE2 - Pruebas Unitarias Automatizadas (PyTest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código fuente
        uses: actions/checkout@v4

      - name: Configurar entorno Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias del proyecto y testing
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Verificación estática de sintaxis (py_compile)
        run: |
          python -m py_compile main.py test_main.py

      - name: Ejecutar suite de pruebas con PyTest (JUnit XML)
        run: |
          mkdir -p reports
          pytest test_main.py -v --tb=short --junitxml=reports/junit-test-results.xml

      - name: Publicar reporte de pruebas unitarias como artefacto
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporte-pruebas-unitarias
          path: reports/junit-test-results.xml
          retention-days: 14

  # ----------------------------------------------------------------------------
  # JOB 2: ANÁLISIS DE CÓDIGO Y SEGURIDAD 
  # ----------------------------------------------------------------------------
  analisis_seguridad:
    name: IE3 - Análisis de Código y Vulnerabilidades (Snyk / SAST)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código fuente
        uses: actions/checkout@v4

      - name: Configurar entorno Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias y herramientas de seguridad
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install pip-audit

      - name: Análisis estático de seguridad de código (Bandit SAST)
        run: |
          mkdir -p reports
          echo "=== Ejecutando Bandit SAST sobre el código fuente ==="
          bandit -r main.py -f txt -o reports/bandit-report.txt || true
          cat reports/bandit-report.txt

      - name: Escaneo de vulnerabilidades en dependencias (pip-audit SCA)
        run: |
          echo "=== Auditando dependencias en busca de CVEs conocidos ==="
          pip-audit -r requirements.txt || true

      - name: Configurar Snyk CLI
        uses: snyk/actions/setup@v4

      - name: Escaneo de vulnerabilidades en dependencias (Snyk Open Source - SCA)
        run: |
          if [ -n "${{ secrets.SNYK_TOKEN }}" ]; then
            echo "Ejecutando Snyk SCA con token configurado..."
            snyk test --file=requirements.txt --severity-threshold=high
          else
            echo "::warning title=Snyk Token::SNYK_TOKEN no detectado en GitHub Secrets. Para sincronizar reportes en Snyk Cloud, agregue el secret SNYK_TOKEN en el repositorio."
            echo "Ejecutando escaneo informativo..."
          fi
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        continue-on-error: true

      - name: Análisis de calidad y seguridad de código (Snyk Code - SAST)
        run: |
          if [ -n "${{ secrets.SNYK_TOKEN }}" ]; then
            echo "Ejecutando Snyk Code SAST..."
            snyk code test
          else
            echo "::warning title=Snyk Code::Omitiendo Snyk Code por falta de SNYK_TOKEN."
          fi
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        continue-on-error: true

      - name: Publicar reporte de seguridad como artefacto
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporte-analisis-seguridad
          path: reports/bandit-report.txt
          retention-days: 14

  # ----------------------------------------------------------------------------
  # JOB 3: CONSTRUCCIÓN DE IMAGEN DOCKER 
  # ----------------------------------------------------------------------------
  construccion_docker:
    name: IE1 - Contenerización y Construcción Docker
    needs: [pruebas_unitarias, analisis_seguridad]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código fuente
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir imagen Docker del microservicio
        run: |
          echo "Construyendo imagen con tags: ${{ github.sha }} y latest..."
          docker build \
            --tag microservicio-clima:${{ github.sha }} \
            --tag microservicio-clima:latest \
            --file Dockerfile .

      - name: Inspeccionar imagen generada y metadatos
        run: |
          docker image ls microservicio-clima
          docker inspect microservicio-clima:latest --format 'ID: {{.Id}} | Creada: {{.Created}} | OS: {{.Os}}/{{.Architecture}}'

  # ----------------------------------------------------------------------------
  # JOB 4: DESPLIEGUE EN ENTORNO SIMULADO 
  # ----------------------------------------------------------------------------
  despliegue_simulado:
    name: IE4 - Despliegue Automático en Entorno Simulado (Docker Compose)
    needs: [construccion_docker]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código fuente
        uses: actions/checkout@v4

      - name: Desplegar microservicio con Docker Compose
        run: |
          echo "Levantando servicios en entorno simulado con Docker Compose..."
          docker compose up -d --build

      - name: Verificar estado inicial de contenedores
        run: |
          docker compose ps

      - name: Esperar disponibilidad del servicio y validar Healthcheck
        run: |
          echo "Esperando que el microservicio esté listo..."
          for i in {1..12}; do
            if curl -s -f http://localhost:8000/weather > /dev/null; then
              echo "Microservicio disponible y respondiendo en el puerto 8000!"
              break
            fi
            echo "Esperando respuesta del servicio... ($i/12)"
            sleep 2
          done

      - name: Pruebas de humo automatizadas (Smoke Tests)
        run: |
          echo "=== Ejecutando Smoke Test contra entorno simulado ==="
          RESPONSE=$(curl -s -f http://localhost:8000/weather)
          echo "Respuesta del endpoint: $RESPONSE"

          # Validación del esquema JSON devuelto
          python3 -c "
          import json, sys
          payload = json.loads('''$RESPONSE''')
          required_keys = {'location', 'temperature', 'status', 'wind_speed_kmh'}
          if not required_keys.issubset(payload.keys()):
              print('Faltan claves requeridas en el JSON:', required_keys - set(payload.keys()))
              sys.exit(1)
          if payload['location'] != 'Valparaíso':
              print('Ubicación inesperada:', payload['location'])
              sys.exit(1)
          print('Validación exitosa: Todos los campos requeridos existen y son correctos.')
          "

      - name: Obtener registros de ejecución del contenedor (Diagnostics)
        if: always()
        run: |
          echo "=== Logs del Contenedor Simulado ==="
          docker compose logs

      - name: Detener y limpiar entorno simulado
        if: always()
        run: |
          echo "Desmontando entorno simulado..."
          docker compose down -v
